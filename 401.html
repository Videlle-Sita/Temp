  <script>
  let lastWidth = window.innerWidth;
  let resizeTimer;
  window.addEventListener('resize', () => {
    const currentWidth = window.innerWidth;
    // DESKTOP -> MOBILE
    if (lastWidth > 991 && currentWidth <= 991) {
      document.body.style.overflow = 'hidden';
      sessionStorage.setItem('savedHash', window.location.hash);
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        location.reload();
      }, 300);
    }
    // MOBILE -> DESKTOP
    if (lastWidth <= 991 && currentWidth > 991) {
      document.body.style.overflow = 'hidden';
      const section = document.querySelector('.work-container');
      if (section) {
        requestAnimationFrame(() => {
          window.scrollTo({
            top: section.offsetTop + section.offsetHeight - window.innerHeight,
            behavior: 'instant',
          });
          setTimeout(() => {
            document.body.style.overflow = '';
          }, 300);
        });
      }
    }
    lastWidth = currentWidth;
  });
  // Restore hash after reload
  window.addEventListener('load', () => {
    const savedHash = sessionStorage.getItem('savedHash');
    if (savedHash) {
      history.replaceState(null, null, savedHash);
      sessionStorage.removeItem('savedHash');
    }
  });
</script>
